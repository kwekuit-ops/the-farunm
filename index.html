<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Farunm | WhatsApp Channel</title>
    <!-- Basic SEO -->
    <meta name="description" content="Join our thriving community of tech enthusiasts and students. Get the latest updates directly on your WhatsApp.">
    <meta name="keywords" content="tech community, whatsapp channel, students, programming">
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    
    <!-- External CSS for Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Theme Toggle Button -->
    <div class="theme-switch">
        <button id="theme-toggle" aria-label="Toggle Dark/Light Mode">
            <i class="fas fa-sun"></i>
        </button>
    </div>

    <!-- Popup Notification -->
    <div class="popup" id="welcome-popup">
        <p>👋 Tap below to join the community!</p>
        <button id="close-popup"><i class="fas fa-times"></i></button>
    </div>

    <main class="container">
        <!-- Profile / Logo Section -->
        <div class="profile-section">
            <div class="logo">
                <i class="fas fa-rocket"></i>
            </div>
            <h1>The Farunm</h1>
            <p class="description">Learn how to make money just by playing games.</p>
        </div>

        <!-- Stats Counter -->
        <div class="stats-section">
            <div class="stat-badge">
                <i class="fas fa-users"></i>
                <span>5000+ members joined</span>
            </div>
            <div class="live-activity" id="live-activity">
                <span class="pulse"></span>
                <span>12 people joined today</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-section">
            <button id="join-btn" class="glow-button primary">
                <i class="fab fa-whatsapp"></i>
                <span class="btn-text">Join WhatsApp Channel</span>
                <span class="loader" style="display: none;"></span>
            </button>
            <button id="join-telegram-btn" class="glow-button primary telegram-btn">
                <i class="fab fa-telegram-plane"></i>
                <span class="btn-text">Join Telegram Channel</span>
                <span class="loader" style="display: none;"></span>
            </button>
            <button id="copy-btn" class="secondary-button">
                <i class="fas fa-link"></i>
                Copy WhatsApp Link
            </button>
        </div>

        <!-- Social Media Links -->
        <div class="social-section">
            <p>Connect with us</p>
            <div class="social-icons">
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            </div>
        </div>
    </main>

    <!-- Smooth Redirect Overlay -->
    <div class="redirect-overlay" id="redirect-overlay">
        <div class="redirect-content">
            <i class="fab fa-whatsapp whatsapp-icon" id="redirect-icon"></i>
            <h2 id="redirect-text">Redirecting to WhatsApp...</h2>
            <p>Get ready to join our awesome community.</p>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
